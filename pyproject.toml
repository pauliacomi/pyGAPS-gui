[build-system]
requires = [
    "setuptools>=77",
    "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "pygapsgui"
description = "GUI for pyGAPS"
readme = "README.rst"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Paul Iacomi", email = "mail@pauliacomi.com" }]
requires-python = ">=3.9"
keywords = ["adsorption", "characterization", "porous materials"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "pyside6>=6.8.3",
    "qtpy>=2.0.1",
    "matplotlib>=3.5.2",
    "rapidfuzz>=2",
    "pygaps>=4.6.1,<5",
    # pyGAPS 4.6.1 AIF parsing uses pandas.to_numeric(errors="ignore"), removed in pandas 3.
    "pandas<3",
    "docutils",
]
dynamic = ["version"]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.16",
    "packaging>=23",
]
docs = [
    "pygments>=2.11",
    "docutils>=0.11",
    "doc8",
    "pandoc",
    "restructuredtext-lint",
    "sphinx>=4.0",
    "sphinx-copybutton",
    "furo",
]

[project.scripts]
pygapsgui = "pygapsgui:main"

[project.urls]
Homepage = "https://github.com/pauliacomi/pyGAPS-gui"
Source = "https://github.com/pauliacomi/pyGAPS-gui"
Issues = "https://github.com/pauliacomi/pyGAPS-gui/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.rst"]
"pygapsgui.resources" = ["**/*"]

# versioning: setuptools_scm
[tool.setuptools_scm]
version_file = "src/pygapsgui/_version.py"
local_scheme = 'dirty-tag'
fallback_version = '0.2.0'


# linting: pylint
[tool.pylint.basic]
extension-pkg-whitelist = [
    "numpy",
    "pandas",
    "matplotlib",
    "qtpy",
    "pyside6",
]
[tool.pylint.messages_control]
disable = [
    "invalid-name", # pyside methods #TODO: remove when switching to true_property pyside option
    "logging-fstring-interpolation", # fstrings are fast
    "import-outside-toplevel", # required for optimisations
    "wrong-import-position", # often done through code for optimisations
    "too-many-instance-attributes", # we don't need these
    "too-many-branches", # we don't need these
    "too-many-locals", # we don't need these
    "too-many-arguments", # we don't need these
    "keyword-arg-before-vararg", # we don't need these
]

# linting: pydocstyle
[tool.pydocstyle]
convention = "numpy"
match-dir = "src\\/.*"

# formatting: yapf
[tool.yapf]
based_on_style = "pep8"
dedent_closing_brackets = true
coalesce_brackets = true
split_complex_comprehension = true
split_before_dot = true

# formatting: isort
[tool.isort]
force_single_line = true
line_length = 120
known_first_party = "pygaps"
default_section = "THIRDPARTY"
forced_separate = "test_pygaps"
skip = [".tox",".eggs","ci/templates","build","dist"]
